<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Game Builder</title>
  <style>
    :root { color-scheme: light dark; font-family: Inter, system-ui, sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; padding: 16px; background: transparent; }
    main { display: grid; gap: 12px; max-width: 720px; margin: auto; }
    h2 { margin: 0; font-size: 20px; }
    p { margin: 0; opacity: .72; font-size: 13px; }
    label { display: grid; gap: 6px; font-size: 13px; font-weight: 600; }
    input, textarea { width: 100%; padding: 12px; border: 1px solid color-mix(in srgb, currentColor 25%, transparent); border-radius: 12px; background: color-mix(in srgb, Canvas 94%, currentColor 6%); color: CanvasText; font: inherit; font-weight: 400; }
    textarea { min-height: 150px; resize: vertical; }
    .actions { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
    button { min-height: 42px; border: 0; border-radius: 12px; background: #10a37f; color: white; font: inherit; font-weight: 700; cursor: pointer; }
    button.secondary { background: #64748b; }
    button:disabled { opacity: .55; cursor: not-allowed; }
    #status { min-height: 18px; }
  </style>
</head>
<body>
  <main>
    <h2>Game Builder</h2>
    <p>Опиши объект и его поведение — ChatGPT сгенерирует код и при просьбе сохранит его в проект.</p>
    <label>Название объекта<input id="name" placeholder="Например: HeroController" /></label>
    <label>Описание поведения<textarea id="behavior" placeholder="HP, движение, синхронизация по мультиплееру, компоненты и т.п."></textarea></label>
    <div class="actions">
      <button data-mode="generate">Сгенерировать</button>
      <button class="secondary" data-mode="fix">Исправить</button>
      <button class="secondary" data-mode="optimize">Оптимизировать</button>
    </div>
    <p id="status" role="status"></p>
  </main>
  <script type="module">
    const name = document.querySelector("#name");
    const behavior = document.querySelector("#behavior");
    const status = document.querySelector("#status");
    const saved = window.openai?.widgetState;
    if (saved) { name.value = saved.name ?? ""; behavior.value = saved.behavior ?? ""; }
    const save = () => window.openai?.setWidgetState?.({ name: name.value, behavior: behavior.value });
    name.addEventListener("input", save);
    behavior.addEventListener("input", save);

    document.querySelector(".actions").addEventListener("click", async (event) => {
      const button = event.target.closest("button");
      if (!button) return;
      const objectName = name.value.trim();
      const description = behavior.value.trim();
      if (!objectName || !description) { status.textContent = "Заполни оба поля."; return; }
      document.querySelectorAll("button").forEach((item) => { item.disabled = true; });
      const mode = button.dataset.mode;
      const instruction = {
        generate: "Сгенерируй рабочий игровой код и объясни, куда его добавить.",
        fix: "Найди ошибки и предложи исправленный полный вариант кода.",
        optimize: "Оптимизируй архитектуру, производительность и сетевую логику.",
      }[mode];
      const prompt = `${instruction}\n\nОбъект: ${objectName}\nОписание поведения:\n${description}\n\nЕсли я попрошу сохранить результат, используй инструмент write_project_file и записывай только в настроенную папку проекта.`;
      status.textContent = "Отправляю задачу в ChatGPT…";
      try {
        await window.openai.sendFollowUpMessage({ prompt, scrollToBottom: true });
        status.textContent = "Задача отправлена в чат.";
      } catch {
        status.textContent = "Не удалось отправить задачу.";
      } finally {
        document.querySelectorAll("button").forEach((item) => { item.disabled = false; });
      }
    });
  </script>
</body>
</html>
